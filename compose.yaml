services:
  backend:
    build:
      context: ./backend
    container_name: portfolio-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-}
      VAULT_ADMIN_USERNAME: ${VAULT_ADMIN_USERNAME:-}
      VAULT_ADMIN_PASSWORD_HASH: ${VAULT_ADMIN_PASSWORD_HASH:-}
      VAULT_VIEWER_USERNAME: ${VAULT_VIEWER_USERNAME:-}
      VAULT_VIEWER_PASSWORD_HASH: ${VAULT_VIEWER_PASSWORD_HASH:-}
      VAULT_DOCUMENT_FILENAME: ${VAULT_DOCUMENT_FILENAME:-private-document.pdf}
      VAULT_DOCUMENT_TITLE: ${VAULT_DOCUMENT_TITLE:-Private Document}
    volumes:
      - ./backend/private-docs:/app/private-docs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: portfolio-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
