services:
  backend:
    build:
      context: ./backend
    container_name: portfolio-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      FRONTEND_URL: http://localhost:8080
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: portfolio-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
